<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY CAMPUS FIX — Campus Navigation</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    /* TOP PANEL */
    #topPanel {
        position: absolute;
        z-index: 1000;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: min(92%, 500px);
        background: rgba(10, 15, 25, 0.94);
        color: white;
        padding: 15px;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }

    #topPanel h2 {
        margin: 0 0 10px;
        font-size: 19px;
        text-align: center;
    }

    #destination {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
    }

    #navigateBtn {
        width: 100%;
        margin-top: 9px;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #1683ff;
        color: white;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
    }

    /* VOICE BUTTON */
    #voiceBtn {
        width: 100%;
        margin-top: 9px;
        padding: 13px;
        border: 2px solid #00d9ff;
        border-radius: 10px;
        background: rgba(0, 217, 255, 0.12);
        color: #00eaff;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
    }

    #voiceBtn.enabled {
        background: #00bcd4;
        color: white;
        box-shadow: 0 0 15px rgba(0, 217, 255, 0.45);
    }

    /* CURRENT INSTRUCTION */
    #instructionBox {
        position: absolute;
        z-index: 1000;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: min(92%, 500px);
        background: rgba(10, 15, 25, 0.95);
        color: white;
        padding: 15px;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        text-align: center;
    }

    #instructionTitle {
        font-size: 12px;
        color: #00d9ff;
        margin-bottom: 5px;
        font-weight: bold;
    }

    #instruction {
        font-size: 17px;
        font-weight: bold;
        line-height: 1.35;
    }

    #distance {
        margin-top: 7px;
        font-size: 13px;
        color: #bbb;
    }

    /* JARVIS STATUS */
    #voiceStatus {
        margin-top: 6px;
        text-align: center;
        font-size: 11px;
        color: #9aa;
    }

    .leaflet-control-attribution {
        font-size: 9px;
    }
</style>
</head>

<body>

<div id="map"></div>

<div id="topPanel">

    <h2>🧭 MY CAMPUS FIX</h2>

    <select id="destination">
        <option value="">Select your destination</option>

        <option value="13.08446,77.48343">
            EEE / ECE / MT Engineering Block
        </option>

        <option value="13.08505,77.48509">
            CSE Block
        </option>

        <option value="13.08579,77.48569">
            Administration Block
        </option>

        <option value="13.08476,77.48571">
            Polytechnic / Civil / Biotech / ANA Block
        </option>

        <option value="13.08475,77.48471">
            Mechanical / AI&ML / AE Engineering
        </option>

        <option value="13.08388,77.48402">
            MBA Block
        </option>

        <option value="13.0894,77.4858">
            Post Office
        </option>

        <option value="13.08337,77.47985">
            Boys Hostel
        </option>

        <option value="13.0837,77.47991">
            Girls Hostel
        </option>

        <option value="13.08549,77.48500">
            Admission Block / CPRD
        </option>
    </select>

    <button id="navigateBtn">
        🚀 START NAVIGATION
    </button>

    <button id="voiceBtn">
        🔊 ENABLE VOICE ASSISTANCE
    </button>

    <div id="voiceStatus">
        Voice assistance is currently OFF
    </div>

</div>

<div id="instructionBox">

    <div id="instructionTitle">
        NAVIGATION INSTRUCTION
    </div>

    <div id="instruction">
        Select a destination to begin.
    </div>

    <div id="distance"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {
    zoomControl: true,
    dragging: true,
    scrollWheelZoom: true,
    doubleClickZoom: true,
    touchZoom: true
}).setView([13.0848, 77.4847], 16);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 20,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/* =========================================================
   CAMPUS PLACES
========================================================= */

const places = [
    {
        name: "EEE / ECE / MT Engineering Block",
        lat: 13.08446,
        lng: 77.48343
    },

    {
        name: "CSE Block",
        lat: 13.08505,
        lng: 77.48509
    },

    {
        name: "Administration Block",
        lat: 13.08579,
        lng: 77.48569
    },

    {
        name: "Polytechnic / Civil / Biotech / ANA Block",
        lat: 13.08476,
        lng: 77.48571
    },

    {
        name: "Mechanical / AI&ML / AE Engineering",
        lat: 13.08475,
        lng: 77.48471
    },

    {
        name: "MBA Block",
        lat: 13.08388,
        lng: 77.48402
    },

    {
        name: "Post Office",
        lat: 13.0894,
        lng: 77.4858
    },

    {
        name: "Boys Hostel",
        lat: 13.08337,
        lng: 77.47985
    },

    {
        name: "Girls Hostel",
        lat: 13.0837,
        lng: 77.47991
    },

    {
        name: "Admission Block / CPRD",
        lat: 13.08549,
        lng: 77.48500
    }
];


/* =========================================================
   MARKERS
========================================================= */

const markerLayer = L.layerGroup().addTo(map);

places.forEach(place => {

    const marker = L.marker([
        place.lat,
        place.lng
    ]);

    marker.bindPopup(
        `<b>${place.name}</b>`
    );

    marker.addTo(markerLayer);

});


/* =========================================================
   USER LOCATION
========================================================= */

let userMarker = null;
let userLocation = null;

navigator.geolocation.watchPosition(

    position => {

        userLocation = [
            position.coords.latitude,
            position.coords.longitude
        ];

        if (!userMarker) {

            userMarker = L.circleMarker(
                userLocation,
                {
                    radius: 8,
                    color: "#1683ff",
                    fillColor: "#1683ff",
                    fillOpacity: 1
                }
            ).addTo(map);

        } else {

            userMarker.setLatLng(userLocation);

        }

    },

    error => {

        console.log(
            "Location error:",
            error.message
        );

    },

    {
        enableHighAccuracy: true,
        maximumAge: 2000,
        timeout: 10000
    }

);


/* =========================================================
   NAVIGATION VARIABLES
========================================================= */

let routeLine = null;

let destinationPoint = null;

let navigationActive = false;

let currentInstructionIndex = 0;

let navigationSteps = [];

let voiceEnabled = false;

let lastSpokenInstruction = "";


/* =========================================================
   VOICE SYSTEM
========================================================= */

const voiceBtn =
    document.getElementById("voiceBtn");

const voiceStatus =
    document.getElementById("voiceStatus");


/*
    Find a deeper / male sounding voice
*/

function getMaleVoice() {

    const voices =
        window.speechSynthesis.getVoices();

    if (!voices.length) {
        return null;
    }

    const preferredNames = [

        "Google UK English Male",

        "Google US English",

        "Microsoft David",

        "Microsoft Mark",

        "Daniel",

        "Alex",

        "Fred"

    ];

    for (const name of preferredNames) {

        const found =
            voices.find(
                voice =>
                    voice.name
                    .toLowerCase()
                    .includes(name.toLowerCase())
            );

        if (found) {
            return found;
        }

    }

    /*
       Fallback to an English voice
    */

    return voices.find(
        voice =>
            voice.lang &&
            voice.lang.toLowerCase().startsWith("en")
    ) || voices[0];

}


/*
    JARVIS-style speech
*/

function speak(text, force = false) {

    if (!voiceEnabled && !force) {
        return;
    }

    if (!text) {
        return;
    }

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    const selectedVoice =
        getMaleVoice();

    if (selectedVoice) {
        speech.voice = selectedVoice;
    }

    speech.lang = "en-US";

    /*
       Deeper / controlled voice effect
    */

    speech.pitch = 0.72;

    speech.rate = 0.92;

    speech.volume = 1.0;

    window.speechSynthesis.speak(speech);

}


/*
    Load voices when browser makes them available
*/

window.speechSynthesis.onvoiceschanged =
    function() {

        getMaleVoice();

    };


/* =========================================================
   VOICE BUTTON
========================================================= */

voiceBtn.addEventListener(
    "click",
    function() {

        voiceEnabled =
            !voiceEnabled;

        if (voiceEnabled) {

            voiceBtn.classList.add(
                "enabled"
            );

            voiceBtn.innerHTML =
                "🔇 DISABLE VOICE ASSISTANCE";

            voiceStatus.innerHTML =
                "JARVIS voice assistance is ACTIVE";

            /*
                Greeting
            */

            speak(
                "Hello. Welcome to My Campus Fix. Voice assistance is now enabled. I will guide you through every turn."
            );

        } else {

            voiceBtn.classList.remove(
                "enabled"
            );

            voiceBtn.innerHTML =
                "🔊 ENABLE VOICE ASSISTANCE";

            voiceStatus.innerHTML =
                "Voice assistance is currently OFF";

            window.speechSynthesis.cancel();

        }

    }
);


/* =========================================================
   DISTANCE FUNCTION
========================================================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const p1 =
        lat1 * Math.PI / 180;

    const p2 =
        lat2 * Math.PI / 180;

    const dLat =
        (lat2 - lat1)
        * Math.PI / 180;

    const dLon =
        (lon2 - lon1)
        * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(p1) *
        Math.cos(p2) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;

}


/* =========================================================
   BEARING
========================================================= */

function getBearing(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const y =
        Math.sin(
            (lon2 - lon1)
            * Math.PI / 180
        )
        *
        Math.cos(
            lat2 * Math.PI / 180
        );

    const x =
        Math.cos(
            lat1 * Math.PI / 180
        )
        *
        Math.sin(
            lat2 * Math.PI / 180
        )
        -
        Math.sin(
            lat1 * Math.PI / 180
        )
        *
        Math.cos(
            lat2 * Math.PI / 180
        )
        *
        Math.cos(
            (lon2 - lon1)
            * Math.PI / 180
        );

    const bearing =
        Math.atan2(y, x)
        * 180 / Math.PI;

    return (
        bearing + 360
    ) % 360;

}


/* =========================================================
   DIRECTION NAME
========================================================= */

function directionName(
    bearing
) {

    if (
        bearing >= 337.5 ||
        bearing < 22.5
    ) {
        return "north";
    }

    if (bearing < 67.5) {
        return "northeast";
    }

    if (bearing < 112.5) {
        return "east";
    }

    if (bearing < 157.5) {
        return "southeast";
    }

    if (bearing < 202.5) {
        return "south";
    }

    if (bearing < 247.5) {
        return "southwest";
    }

    if (bearing < 292.5) {
        return "west";
    }

    return "northwest";

}


/* =========================================================
   START NAVIGATION
========================================================= */

document
.getElementById("navigateBtn")
.addEventListener(
    "click",
    startNavigation
);


function startNavigation() {

    const value =
        document
        .getElementById("destination")
        .value;

    if (!value) {

        alert(
            "Please select a destination."
        );

        return;
    }


    if (!userLocation) {

        alert(
            "Your current location is not available yet. Please allow location access and try again."
        );

        return;
    }


    const [lat, lng] =
        value.split(",")
        .map(Number);


    destinationPoint = {
        lat: lat,
        lng: lng
    };


    navigationActive = true;

    currentInstructionIndex = 0;


    /*
       Remove old route
    */

    if (routeLine) {

        map.removeLayer(
            routeLine
        );

    }


    /*
       Hide other place markers
       during navigation
    */

    markerLayer.clearLayers();


    /*
       Draw route
    */

    routeLine =
        L.polyline(

            [
                userLocation,

                [
                    destinationPoint.lat,
                    destinationPoint.lng
                ]

            ],

            {
                weight: 7,
                opacity: 0.9
            }

        ).addTo(map);


    /*
       Destination marker
    */

    L.marker(
        [
            destinationPoint.lat,
            destinationPoint.lng
        ]
    )
    .bindPopup(
        "<b>Destination</b>"
    )
    .addTo(map);


    /*
       Fit route
    */

    map.fitBounds(
        routeLine.getBounds(),
        {
            padding: [50, 50]
        }
    );


    /*
       Create navigation instructions
    */

    createNavigationInstructions();


    /*
       Announce first instruction
    */

    if (voiceEnabled) {

        speak(
            "Navigation started. " +
            navigationSteps[0]
        );

    }

}


/* =========================================================
   CREATE NAVIGATION INSTRUCTIONS
========================================================= */

function createNavigationInstructions() {

    navigationSteps = [];


    const distance =
        calculateDistance(

            userLocation[0],
            userLocation[1],

            destinationPoint.lat,
            destinationPoint.lng

        );


    const bearing =
        getBearing(

            userLocation[0],
            userLocation[1],

            destinationPoint.lat,
            destinationPoint.lng

        );


    const direction =
        directionName(
            bearing
        );


    let distanceText;


    if (distance < 1000) {

        distanceText =
            Math.round(distance)
            + " meters";

    } else {

        distanceText =
            (distance / 1000)
            .toFixed(1)
            + " kilometers";

    }


    navigationSteps.push(

        "Head " +
        direction +
        " for approximately " +
        distanceText +
        " toward your destination."

    );


    navigationSteps.push(

        "Continue straight toward " +
        getDestinationName() +
        "."

    );


    navigationSteps.push(

        "You are approaching your destination."

    );


    navigationSteps.push(

        "You have arrived at " +
        getDestinationName() +
        "."
    );


    showInstruction(0);

}


/* =========================================================
   DESTINATION NAME
========================================================= */

function getDestinationName() {

    const select =
        document
        .getElementById(
            "destination"
        );

    return select.options[
        select.selectedIndex
    ].text;

}


/* =========================================================
   SHOW INSTRUCTION
========================================================= */

function showInstruction(index) {

    if (
        !navigationSteps[index]
    ) {
        return;
    }


    currentInstructionIndex =
        index;


    document
    .getElementById(
        "instruction"
    )
    .innerHTML =
        navigationSteps[index];


    if (index === 0) {

        document
        .getElementById(
            "instructionTitle"
        )
        .innerHTML =
            "START NAVIGATION";

    } else if (
        index === navigationSteps.length - 1
    ) {

        document
        .getElementById(
            "instructionTitle"
        )
        .innerHTML =
            "DESTINATION REACHED";

    } else {

        document
        .getElementById(
            "instructionTitle"
        )
        .innerHTML =
            "NEXT INSTRUCTION";

    }


    /*
       Speak only if it changed
    */

    if (
        voiceEnabled &&
        lastSpokenInstruction
        !== navigationSteps[index]
    ) {

        lastSpokenInstruction =
            navigationSteps[index];

        speak(
            navigationSteps[index]
        );

    }

}


/* =========================================================
   UPDATE NAVIGATION
========================================================= */

function updateNavigation() {

    if (
        !navigationActive ||
        !userLocation ||
        !destinationPoint
    ) {
        return;
    }


    const distance =
        calculateDistance(

            userLocation[0],
            userLocation[1],

            destinationPoint.lat,
            destinationPoint.lng

        );


    /*
       Update route
    */

    if (routeLine) {

        routeLine.setLatLngs(

            [
                userLocation,

                [
                    destinationPoint.lat,
                    destinationPoint.lng
                ]

            ]

        );

    }


    /*
       Update distance
    */

    let distanceText;


    if (distance < 1000) {

        distanceText =
            Math.round(distance)
            + " m remaining";

    } else {

        distanceText =
            (distance / 1000)
            .toFixed(1)
            + " km remaining";

    }


    document
    .getElementById(
        "distance"
    )
    .innerHTML =
        distanceText;


    /*
       Destination reached
    */

    if (distance <= 15) {

        navigationActive = false;

        showInstruction(
            navigationSteps.length - 1
        );

        if (voiceEnabled) {

            speak(
                "You have arrived at " +
                getDestinationName() +
                ". Navigation complete."
            );

        }

        return;

    }


    /*
       Progress instructions
    */

    if (distance <= 50) {

        showInstruction(2);

    } else if (distance <= 150) {

        showInstruction(1);

    } else {

        showInstruction(0);

    }

}


/* =========================================================
   LOCATION UPDATE
========================================================= */

navigator.geolocation.watchPosition(

    position => {

        userLocation = [

            position.coords.latitude,

            position.coords.longitude

        ];


        if (userMarker) {

            userMarker.setLatLng(
                userLocation
            );

        }


        updateNavigation();

    },

    error => {

        console.log(
            "Navigation location error:",
            error
        );

    },

    {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
    }

);


/* =========================================================
   MAP MOVEMENT FIX
========================================================= */

let mapMoving = false;


map.on(
    "movestart",
    function() {

        mapMoving = true;

    }
);


map.on(
    "moveend",
    function() {

        mapMoving = false;

    }
);


/*
   Prevent unnecessary automatic
   movement while user is manually
   scrolling/dragging.
*/

setInterval(
    function() {

        if (
            navigationActive &&
            !mapMoving
        ) {

            updateNavigation();

        }

    },
    3000
);


/* =========================================================
   INITIAL GREETING
========================================================= */

window.addEventListener(
    "load",
    function() {

        /*
           Do NOT automatically speak.
           Browser security usually requires
           a user interaction first.

           The greeting is spoken when the
           user presses ENABLE VOICE ASSISTANCE.
        */

        console.log(
            "MY CAMPUS FIX navigation loaded."
        );

    }
);

</script>

</body>
</html>
