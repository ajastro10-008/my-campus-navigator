<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY CAMPUS FIX — Acharya Campus Navigator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:#fff;padding:16px}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;font-size:14px;opacity:.85}
.controls{background:#fff;padding:14px;box-shadow:0 2px 8px #0001;position:relative;z-index:1000}
select,button{width:100%;padding:12px;border-radius:9px;font-size:15px;border:1px solid #cfd5df;margin-top:8px}
button{border:0;background:#111827;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e9eef5;color:#172033}.danger{background:#b42318}
button:disabled{opacity:.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}#status{margin-top:10px;padding:10px;border-radius:8px;background:#f1f5f9;font-size:14px;line-height:1.45}
#map{height:66vh;min-height:430px}.info{background:#fff;padding:12px 14px;border-top:1px solid #e5e7eb}.info strong{display:block;margin-bottom:5px}
#instructions{font-size:13px;line-height:1.5;padding-left:22px}@media(max-width:600px){.grid{grid-template-columns:1fr}#map{height:61vh}}
</style>
</head>
<body>
<header><h1>🧭 MY CAMPUS FIX</h1><p>Acharya Campus Navigator</p></header>
<div class="controls">
<select id="destination"><option value="">📍 Select your destination</option></select>
<div class="grid">
<button onclick="getLocation()">📍 Use My Location</button>
<button class="secondary" onclick="showAllPlaces()">🗺️ Show All Places</button>
</div>
<div class="grid">
<button id="navBtn" onclick="navigate()">🧭 NAVIGATE</button>
<button class="danger" onclick="clearRoute()">✕ Clear Route</button>
</div>
<div id="status">Select a destination, then tap <b>Use My Location</b>.</div>
</div>
<div id="map"></div>
<div class="info"><strong id="selectedPlace">No destination selected</strong><div id="selectedDescription">Choose a place from the destination list.</div><ol id="instructions"></ol></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const places = [{"id":1,"name":"EEE, ECE, MT Engineering Block","lat":13.08446,"lng":77.48343,"category":"Engineering","desc":"Engineering block for EEE, ECE and MT Engineering."},{"id":2,"name":"CSE Block / Computer Science & Info. Science Engineering","lat":13.08505,"lng":77.48509,"category":"Engineering","desc":"Engineering block for Computer Science and Information Science Engineering."},{"id":3,"name":"Administration Block","lat":13.08579,"lng":77.48569,"category":"Administration","desc":"Main administrative center for college offices, student services and official academic matters."},{"id":4,"name":"Polytechnic Block, Civil & Biotech Engineering / ANA Block","lat":13.08476,"lng":77.48571,"category":"Engineering","desc":"Polytechnic and engineering facilities including Civil and Biotechnology Engineering."},{"id":5,"name":"Mechanical, AI&ML & AE Engineering","lat":13.08475,"lng":77.48471,"category":"Engineering","desc":"Engineering block serving Mechanical, AI & ML and AE Engineering."},{"id":6,"name":"MBA Block Acharya","lat":13.08388,"lng":77.48402,"category":"Academic","desc":"Academic block for MBA-related activities."},{"id":7,"name":"Post Office","lat":13.0894,"lng":77.4858,"category":"Services","desc":"Post office facility on the campus."},{"id":8,"name":"Hostel — Boys","lat":13.08337,"lng":77.47985,"category":"Hostels","desc":"Boys' hostel area."},{"id":9,"name":"Hostel — Girls","lat":13.0837,"lng":77.47991,"category":"Hostels","desc":"Girls' hostel area."},{"id":10,"name":"Admission Block [CPRD]","lat":13.08549,"lng":77.48461,"category":"Administration","desc":"Admission and CPRD-related services."},{"id":11,"name":"Acharya Institute of Graduate Studies [AIGS]","lat":13.08443,"lng":77.48503,"category":"Institutes","desc":"Acharya Institute of Graduate Studies."},{"id":12,"name":"Acharya School of Architecture [ASA]","lat":13.08397,"lng":77.48405,"category":"Institutes","desc":"Acharya School of Architecture."},{"id":13,"name":"Acharya School of Design [ASD]","lat":13.08406,"lng":77.48476,"category":"Institutes","desc":"Acharya School of Design."},{"id":14,"name":"Allied Health Science Department [AHS]","lat":13.08409,"lng":77.48241,"category":"Health","desc":"Allied Health Science Department."},{"id":15,"name":"Pharmacy Department","lat":13.08454,"lng":77.48236,"category":"Health","desc":"Pharmacy Department."},{"id":16,"name":"College of Nursing","lat":13.083,"lng":77.47992,"category":"Health","desc":"College of Nursing."},{"id":17,"name":"School of Nursing","lat":13.08305,"lng":77.48023,"category":"Health","desc":"School of Nursing."},{"id":18,"name":"Institute of Physiotherapy","lat":13.08806,"lng":77.48545,"category":"Health","desc":"Institute of Physiotherapy."},{"id":19,"name":"Physiotherapy Clinic","lat":13.08873,"lng":77.48549,"category":"Health","desc":"Physiotherapy clinic."},{"id":20,"name":"Nescafe","lat":13.08498,"lng":77.48424,"category":"Food","desc":"Nescafe food and refreshment point."},{"id":21,"name":"Acharya Uniform and Stationery","lat":13.08455,"lng":77.48446,"category":"Services","desc":"Uniform and stationery facility."},{"id":22,"name":"Campus Mart","lat":13.0838,"lng":77.48355,"category":"Services","desc":"Campus shopping facility."},{"id":23,"name":"Clock Tower","lat":13.08452,"lng":77.48305,"category":"Landmarks","desc":"Clock Tower landmark."},{"id":24,"name":"Central Library","lat":13.08475,"lng":77.4839,"category":"Academic","desc":"Central Library for students and academic resources."},{"id":25,"name":"Print Stall","lat":13.08394,"lng":77.48463,"category":"Services","desc":"Printing service facility."},{"id":26,"name":"Cafeteria — Snack Lab","lat":13.08569,"lng":77.48487,"category":"Food","desc":"Snack Lab cafeteria."},{"id":27,"name":"Mini Football Court","lat":13.08506,"lng":77.48369,"category":"Sports","desc":"Mini football court."},{"id":28,"name":"Basketball Court","lat":13.0855,"lng":77.48388,"category":"Sports","desc":"Basketball court."},{"id":29,"name":"Acharya Stadium","lat":13.08557,"lng":77.48297,"category":"Sports","desc":"Acharya Stadium."},{"id":30,"name":"Acharya Victory GYM","lat":13.08612,"lng":77.48416,"category":"Sports","desc":"Acharya Victory Gym."},{"id":31,"name":"Student Affairs","lat":13.08633,"lng":77.48395,"category":"Administration","desc":"Student Affairs facility."},{"id":32,"name":"Swimming Pool","lat":13.08693,"lng":77.48353,"category":"Sports","desc":"Campus swimming pool."},{"id":33,"name":"Lake [Rain Water Harvest]","lat":13.08686,"lng":77.48275,"category":"Environment","desc":"Lake and rainwater-harvesting area."},{"id":34,"name":"Water Treatment Plant","lat":13.08721,"lng":77.48261,"category":"Services","desc":"Water treatment facility."},{"id":35,"name":"Acharya Green Forest","lat":13.08653,"lng":77.4812,"category":"Environment","desc":"Green Forest campus area."},{"id":36,"name":"Cafeteria — L7H Cafeteria","lat":13.08492,"lng":77.48211,"category":"Food","desc":"L7H cafeteria."},{"id":37,"name":"ATM","lat":13.0836,"lng":77.4842,"category":"Services","desc":"ATM facility."},{"id":38,"name":"Entry Gate — 1","lat":13.08361,"lng":77.4843,"category":"Gates","desc":"Campus entry/exit gate 1."},{"id":39,"name":"Entry Gate — 2","lat":13.08357,"lng":77.48402,"category":"Gates","desc":"Campus entry/exit gate 2."},{"id":40,"name":"Entry Gate — 3","lat":13.08549,"lng":77.48642,"category":"Gates","desc":"Campus entry/exit gate 3."},{"id":41,"name":"Entry Gate — 4","lat":13.08618,"lng":77.48643,"category":"Gates","desc":"Campus entry/exit gate 4."},{"id":42,"name":"Entry Gate — 5","lat":13.08804,"lng":77.48623,"category":"Gates","desc":"Campus entry/exit gate 5."},{"id":43,"name":"Car Parking","lat":13.08609,"lng":77.48604,"category":"Parking","desc":"Car parking area."},{"id":44,"name":"Two Wheeler Parking","lat":13.08543,"lng":77.48607,"category":"Parking","desc":"Two-wheeler parking area."},{"id":45,"name":"Main Auditorium","lat":13.08542,"lng":77.48522,"category":"Academic","desc":"Main Auditorium."}];
const map=L.map("map").setView([13.0850,77.4844],16.5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
const destination=document.getElementById("destination"),statusBox=document.getElementById("status"),selectedPlace=document.getElementById("selectedPlace"),selectedDescription=document.getElementById("selectedDescription"),instructions=document.getElementById("instructions");
const markerLayer=L.layerGroup().addTo(map);let userMarker=null,accuracyCircle=null,routeLayer=null,currentLocation=null,watchId=null;
const groups={};places.forEach(p=>(groups[p.category]??=[]).push(p));
Object.keys(groups).sort().forEach(cat=>{const g=document.createElement("optgroup");g.label=cat;groups[cat].forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=p.name;g.appendChild(o)});destination.appendChild(g)});
places.forEach(p=>{const m=L.marker([p.lat,p.lng]).bindPopup("<b>"+esc(p.name)+"</b><br>"+esc(p.desc)+"<br><br><b>Category:</b> "+esc(p.category));m.on("click",()=>{destination.value=p.id;updateSelected()});markerLayer.addLayer(m)});
destination.addEventListener("change",updateSelected);
function updateSelected(){const p=places.find(x=>x.id==destination.value);if(!p){selectedPlace.textContent="No destination selected";selectedDescription.textContent="Choose a place from the destination list.";return}selectedPlace.textContent="📍 "+p.name;selectedDescription.textContent=p.desc+" | "+p.category;map.setView([p.lat,p.lng],18)}
function getLocation(){if(!navigator.geolocation){statusBox.textContent="❌ GPS is not supported by this browser.";return}statusBox.innerHTML="📍 Requesting your location...";navigator.geolocation.getCurrentPosition(pos=>{updateUser(pos);statusBox.innerHTML="📍 Location detected. Select a destination and tap NAVIGATE.";startWatch()},err=>{statusBox.innerHTML="❌ "+locationError(err)}, {enableHighAccuracy:true,timeout:15000,maximumAge:5000})}
function updateUser(pos){const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=pos.coords.accuracy||0;currentLocation={lat,lng};if(!userMarker)userMarker=L.marker([lat,lng]).addTo(map).bindPopup("📍 You are here");else userMarker.setLatLng([lat,lng]);if(!accuracyCircle)accuracyCircle=L.circle([lat,lng],{radius:acc,weight:1,fillOpacity:.08}).addTo(map);else{accuracyCircle.setLatLng([lat,lng]);accuracyCircle.setRadius(acc)}map.setView([lat,lng],18)}
function startWatch(){if(watchId!==null)return;watchId=navigator.geolocation.watchPosition(updateUser,()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
async function navigate(){const p=places.find(x=>x.id==destination.value);if(!p){statusBox.textContent="⚠️ Select a destination first.";return}if(!currentLocation){statusBox.innerHTML="⚠️ First tap <b>Use My Location</b>.";return}
document.getElementById("navBtn").disabled=true;document.getElementById("navBtn").textContent="⏳ CALCULATING...";instructions.innerHTML="";clearRouteOnly();statusBox.innerHTML="🧭 Calculating a walking route to <b>"+esc(p.name)+"</b>...";
try{const body={locations:[{lat:currentLocation.lat,lon:currentLocation.lng,type:"break"},{lat:p.lat,lon:p.lng,type:"break"}],costing:"pedestrian",units:"kilometers",directions_options:{units:"kilometers"}};const r=await fetch("https://valhalla1.openstreetmap.de/route",{method:"POST",headers:{"Content-Type":"application/json","X-Client-Id":"my-campus-fix-campus-navigator"},body:JSON.stringify(body)});if(!r.ok)throw new Error("Routing server HTTP "+r.status);const d=await r.json();if(!d.trip?.legs?.length)throw new Error("No walking route was returned.");const leg=d.trip.legs[0],pts=decode6(leg.shape);routeLayer=L.polyline(pts,{weight:6,opacity:.9}).addTo(map);const km=Number(d.trip.summary.length||0),min=Math.round(Number(d.trip.summary.time||0)/60);statusBox.innerHTML="🧭 <b>"+esc(p.name)+"</b><br>🚶 Distance: "+km.toFixed(2)+" km<br>⏱️ About "+min+" min";(leg.maneuvers||[]).slice(0,8).forEach(x=>{const li=document.createElement("li");li.textContent=x.instruction||"Continue on the route.";instructions.appendChild(li)});if(routeLayer.getBounds().isValid())map.fitBounds(routeLayer.getBounds(),{padding:[35,35]})}catch(e){console.error(e);statusBox.innerHTML="❌ Route could not be calculated.<br>Check internet connection and try again.<br><small>"+esc(e.message)+"</small>"}finally{document.getElementById("navBtn").disabled=false;document.getElementById("navBtn").textContent="🧭 NAVIGATE"}}
function clearRouteOnly(){if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}}
function clearRoute(){clearRouteOnly();instructions.innerHTML="";statusBox.textContent="Route cleared. Select a destination and tap NAVIGATE."}
function showAllPlaces(){const b=markerLayer.getBounds();if(b.isValid())map.fitBounds(b,{padding:[25,25]});statusBox.textContent="🗺️ Showing all "+places.length+" campus destinations."}
function locationError(e){if(e.code===1)return"Location permission was denied. Allow location access and try again.";if(e.code===2)return"Location is unavailable. Try again outdoors or with GPS enabled.";if(e.code===3)return"Location request timed out. Try again.";return"Unable to get your location."}
function decode6(s){let i=0,lat=0,lng=0,out=[];while(i<s.length){let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lat+=r&1?~(r>>1):r>>1;r=0;sh=0;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lng+=r&1?~(r>>1):r>>1;out.push([lat/1e6,lng/1e6])}return out}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
showAllPlaces();
</script>
</body>
</html>
