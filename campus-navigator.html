<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MY CAMPUS FIX - Campus Navigator</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    .top {
      padding: 15px;
      background: #111827;
      color: white;
    }

    .top h2 {
      margin: 0 0 5px 0;
    }

    .controls {
      padding: 15px;
      background: white;
    }

    select, button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #111827;
      color: white;
      cursor: pointer;
      border: none;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
    }

    #map {
      width: 100%;
      height: 70vh;
    }
  </style>
</head>

<body>

<div class="top">
  <h2>🧭 MY CAMPUS FIX</h2>
  <div>Campus Navigator</div>
</div>

<div class="controls">

  <button onclick="getLocation()">
    📍 Use My Location
  </button>

  <select id="destination">
    <option value="">Select Destination</option>
    <option value="13.0668,77.5047">Administration Block</option>
    <option value="13.0675,77.5055">Central Library</option>
    <option value="13.0660,77.5060">Canteen</option>
  </select>

  <button onclick="navigate()">
    🧭 NAVIGATE
  </button>

  <div id="status">
    Select a destination and use your location.
  </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // Initial map position
  const map = L.map('map').setView([13.0668, 77.5047], 17);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  let userMarker = null;
  let routeLine = null;
  let userLocation = null;

  // Destination markers
  const destinations = [
    {
      name: "Administration Block",
      lat: 13.0668,
      lng: 77.5047
    },
    {
      name: "Central Library",
      lat: 13.0675,
      lng: 77.5055
    },
    {
      name: "Canteen",
      lat: 13.0660,
      lng: 77.5060
    }
  ];

  destinations.forEach(function(place) {

    L.marker([place.lat, place.lng])
      .addTo(map)
      .bindPopup("<b>" + place.name + "</b>");

  });


  // Get user's GPS location
  function getLocation() {

    if (!navigator.geolocation) {

      document.getElementById("status").innerHTML =
        "GPS is not supported on this device.";

      return;
    }

    document.getElementById("status").innerHTML =
      "Getting your location...";

    navigator.geolocation.getCurrentPosition(

      function(position) {

        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        userLocation = {
          lat: lat,
          lng: lng
        };

        if (userMarker) {
          map.removeLayer(userMarker);
        }

        userMarker = L.marker([lat, lng])
          .addTo(map)
          .bindPopup("📍 You are here")
          .openPopup();

        map.setView([lat, lng], 18);

        document.getElementById("status").innerHTML =
          "📍 Your location detected.";

      },

      function(error) {

        document.getElementById("status").innerHTML =
          "Location permission was denied or unavailable.";

      },

      {
        enableHighAccuracy: true
      }

    );
  }


  // Navigation
  function navigate() {

    if (!userLocation) {

      alert("First tap 'Use My Location'.");

      return;
    }

    const value =
      document.getElementById("destination").value;

    if (!value) {

      alert("Select a destination.");

      return;
    }

    const parts = value.split(",");

    const destinationLat = parseFloat(parts[0]);
    const destinationLng = parseFloat(parts[1]);


    if (routeLine) {
      map.removeLayer(routeLine);
    }


    // Request walking route
    const url =
      "https://router.project-osrm.org/route/v1/foot/" +
      userLocation.lng + "," +
      userLocation.lat + ";" +
      destinationLng + "," +
      destinationLat +
      "?overview=full&geometries=geojson";


    fetch(url)

      .then(response => response.json())

      .then(data => {

        if (
          !data.routes ||
          data.routes.length === 0
        ) {

          document.getElementById("status").innerHTML =
            "No walking route found.";

          return;
        }

        const route =
          data.routes[0];

        routeLine =
          L.geoJSON(route.geometry)
            .addTo(map);

        map.fitBounds(
          routeLine.getBounds()
        );

        const distance =
          (route.distance / 1000).toFixed(2);

        const minutes =
          Math.round(route.duration / 60);

        document.getElementById("status").innerHTML =
          "🧭 Route: " +
          distance +
          " km • About " +
          minutes +
          " minutes";

      })

      .catch(error => {

        document.getElementById("status").innerHTML =
          "Unable to calculate route.";

      });

  }

</script>

</body>
</html>
